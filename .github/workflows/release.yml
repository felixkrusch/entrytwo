name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write   # required for cosign keyless (OIDC -> Fulcio)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}   # e.g. owner/entrytwo
      RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || 'felixkrusch/entrytwo-releases' }}
    steps:
      - name: Check public distribution repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Configure RELEASE_TOKEN with contents:write access to the public releases-only repository.' >&2; exit 1; }
          test "$RELEASE_REPOSITORY" != "$GITHUB_REPOSITORY" || { echo 'Release assets must not be published to the private source repository.' >&2; exit 1; }
          visibility=$(gh repo view "$RELEASE_REPOSITORY" --json visibility --jq .visibility)
          test "$visibility" = PUBLIC || { echo 'RELEASE_REPOSITORY must be public.' >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Test updater
        run: node --test updater/server.test.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Only stable vMAJOR.MINOR.PATCH tags are supported.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          provenance: mode=min
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push updater
        id: updater
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=min
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-updater:${{ steps.version.outputs.version }}

      - name: Smoke-test published updater on both architectures
        env:
          UPDATER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-updater@${{ steps.updater.outputs.digest }}
        run: bash updater/smoke-test.sh "$UPDATER_IMAGE" linux/amd64 linux/arm64

      - name: Sign image (cosign keyless)
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.2
      - name: cosign sign
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-updater@${{ steps.updater.outputs.digest }}"
        env:
          COSIGN_YES: "true"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          output-file: sbom.spdx.json
          upload-release-assets: false
      - name: Attest SBOM in registry
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Build signed release manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          MIN_VERSION: ${{ vars.MIN_SUPPORTED_VERSION || '0.1.0' }}
          CHANNEL: ${{ vars.RELEASE_CHANNEL || 'stable' }}
          CHANGELOG: ${{ github.server_url }}/${{ env.RELEASE_REPOSITORY }}/releases/tag/${{ github.ref_name }}
        run: |
          cat > manifest.json <<EOF
          {
            "version": "${VERSION}",
            "image": "${IMAGE}",
            "digest": "${DIGEST}",
            "minSupportedVersion": "${MIN_VERSION}",
            "channel": "${CHANNEL}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "changelogUrl": "${CHANGELOG}"
          }
          EOF
          cosign sign-blob --yes --bundle manifest.sigstore.json manifest.json

      - name: Prepare clone-free installation assets
        run: |
          mkdir -p dist
          cp deploy/compose.yaml dist/compose.yaml
          cp .env.example dist/entrytwo.env.example
          cat >> dist/entrytwo.env.example <<EOF

          # Public distribution defaults for this release.
          UPDATE_MANIFEST_URL=https://github.com/${RELEASE_REPOSITORY}/releases/latest/download/manifest.json
          COSIGN_IDENTITY=^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$
          EOF
          cp manifest.json manifest.sigstore.json sbom.spdx.json dist/

      - name: Promote verified images to latest
        env:
          APP_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          APP_DIGEST: ${{ steps.build.outputs.digest }}
          UPDATER_DIGEST: ${{ steps.updater.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$APP_IMAGE:latest" "$APP_IMAGE@$APP_DIGEST"
          docker buildx imagetools create --tag "$APP_IMAGE-updater:latest" "$APP_IMAGE-updater@$UPDATER_DIGEST"

      - name: Publish GitHub Release with manifest
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPOSITORY }}
          token: ${{ secrets.RELEASE_TOKEN }}
          files: |
            dist/manifest.json
            dist/manifest.sigstore.json
            dist/sbom.spdx.json
            dist/compose.yaml
            dist/entrytwo.env.example
          body: |
            ## entrytwo ${{ steps.version.outputs.version }}

            Signed image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}`

            Set `UPDATE_MANIFEST_URL` on your instance to the raw `manifest.json` below
            (or pin `APP_IMAGE` to the digest) to receive this update.

            **Verification policy**
            - Keyless (default): identity `https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}`, issuer `https://token.actions.githubusercontent.com`
            - Manifest: `cosign verify-blob --bundle manifest.sigstore.json --certificate-identity 'https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}' --certificate-oidc-issuer https://token.actions.githubusercontent.com manifest.json`
            - BuildKit provenance is attached to the images; the signed SPDX SBOM is stored in GHCR.
            - Both GHCR packages (`${{ env.IMAGE_NAME }}` and `${{ env.IMAGE_NAME }}-updater`) must be public for anonymous installation.
