version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: entrytwo
      POSTGRES_PASSWORD: entrytwo_dev_password
      POSTGRES_DB: entrytwo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entrytwo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
